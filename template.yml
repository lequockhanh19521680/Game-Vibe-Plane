AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Game Vibe Plane - Well-Architected, Cost-Optimized Real-time Leaderboard System
  Supports 1-1000 users with dev/prod environments

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment environment
  
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain for production (optional)
    
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for custom domain (us-east-1 only)

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasDomain: !And 
    - !Condition IsProd
    - !Not [!Equals [!Ref DomainName, ""]]

Globals:
  Function:
    Runtime: nodejs18.x
    MemorySize: 128  # Cost optimization for 1-1000 users
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SCORES_TABLE: !Ref ScoresTable
        WEBSOCKET_TABLE: !Ref WebSocketTable
        CORS_ORIGIN: !If 
          - HasDomain
          - !Sub "https://${DomainName}"
          - !If 
            - IsProd
            - !Sub "https://${CloudFrontDistribution.DomainName}"
            - "*"

Resources:
  # ============================================================================
  # STORAGE LAYER - DynamoDB Tables
  # ============================================================================
  
  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-scores"
      BillingMode: PAY_PER_REQUEST  # Cost optimization for variable load
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: score
          AttributeType: N
        - AttributeName: country
          AttributeType: S
        - AttributeName: gameType
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GlobalLeaderboard
          KeySchema:
            - AttributeName: gameType
              KeyType: HASH
            - AttributeName: score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CountryLeaderboard
          KeySchema:
            - AttributeName: country
              KeyType: HASH
            - AttributeName: score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Condition IsProd
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: GameVibePlane

  WebSocketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-websockets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: GameVibePlane

  # ============================================================================
  # COMPUTE LAYER - Lambda Functions
  # ============================================================================

  # REST API Functions
  SubmitScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-submit-score"
      CodeUri: backend/src/handlers/
      Handler: submitScore.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /submit-score
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable

  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-leaderboard"
      CodeUri: backend/src/handlers/
      Handler: getLeaderboard.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /leaderboard
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable

  GetCountryLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-country-leaderboard"
      CodeUri: backend/src/handlers/
      Handler: getCountryLeaderboard.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /leaderboard/country
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-health-check"
      CodeUri: backend/src/handlers/
      Handler: healthCheck.handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /health
            Method: GET

  # WebSocket Functions
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-websocket-connect"
      CodeUri: backend/src/handlers/
      Handler: websocket.connectHandler
      Events:
        ConnectRoute:
          Type: ApiGatewayV2
          Properties:
            ApiId: !Ref WebSocketApi
            Route: $connect
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketTable

  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-websocket-disconnect"
      CodeUri: backend/src/handlers/
      Handler: websocket.disconnectHandler
      Events:
        DisconnectRoute:
          Type: ApiGatewayV2
          Properties:
            ApiId: !Ref WebSocketApi
            Route: $disconnect
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketTable

  WebSocketDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-websocket-default"
      CodeUri: backend/src/handlers/
      Handler: websocket.defaultHandler
      Events:
        DefaultRoute:
          Type: ApiGatewayV2
          Properties:
            ApiId: !Ref WebSocketApi
            Route: $default
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WebSocketTable

  # Real-time update processor
  ProcessScoreUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-process-score-update"
      CodeUri: backend/src/handlers/
      Handler: processScoreUpdate.handler
      ReservedConcurrentExecutions: 5  # Cost optimization
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ScoresTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Environment:
        Variables:
          WEBSOCKET_API_ID: !Ref WebSocketApi
          WEBSOCKET_STAGE: !Ref Environment
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WebSocketTable
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/POST/@connections/*"

  # ============================================================================
  # API LAYER - API Gateway
  # ============================================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !If 
          - HasDomain
          - !Sub "'https://${DomainName}'"
          - !If 
            - IsProd
            - !Sub "'https://${CloudFrontDistribution.DomainName}'"
            - "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !If [IsProd, 100, 20]
          ThrottlingBurstLimit: !If [IsProd, 200, 40]
      Tags:
        Environment: !Ref Environment
        Application: GameVibePlane

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-websocket"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"
      Tags:
        Environment: !Ref Environment
        Application: GameVibePlane

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      ThrottleSettings:
        RateLimit: !If [IsProd, 100, 20]
        BurstLimit: !If [IsProd, 200, 40]
      Tags:
        Environment: !Ref Environment
        Application: GameVibePlane


  # ============================================================================
  # FRONTEND HOSTING - S3 + CloudFront
  # ============================================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: GameVibePlane

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OAI for ${AWS::StackName}"

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} Frontend Distribution"
        DefaultRootObject: index.html
        PriceClass: !If [IsProd, PriceClass_100, PriceClass_100]  # Cost optimization
        Aliases: !If
          - HasDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled for SPA
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # Managed-CORS-S3Origin
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: GameVibePlane

  # ============================================================================
  # MONITORING & ALARMS (Well-Architected Observability)
  # ============================================================================

  # CloudWatch Alarms for cost and performance monitoring
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub "${AWS::StackName}-high-error-rate"
      AlarmDescription: "High error rate detected"
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ApiGateway

  # Lambda cost monitoring
  LambdaCostAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-cost"
      AlarmDescription: "Lambda costs are high"
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 10000  # 10 seconds average
      ComparisonOperator: GreaterThanThreshold

Outputs:
  # Backend API Endpoints
  ApiGatewayUrl:
    Description: "REST API Gateway URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-api-url"

  WebSocketUrl:
    Description: "WebSocket API URL"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-websocket-url"

  # Frontend URLs
  CloudFrontUrl:
    Description: "CloudFront Distribution URL"
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-frontend-url"

  # S3 Bucket for deployment
  FrontendBucketName:
    Description: "S3 Bucket for frontend assets"
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-frontend-bucket"

  # CloudFront Distribution ID for cache invalidation
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-cloudfront-id"

  # Environment Info
  Environment:
    Description: "Deployment environment"
    Value: !Ref Environment
    Export:
      Name: !Sub "${AWS::StackName}-environment"