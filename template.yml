AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Cost-optimized CI/CD pipeline for a static frontend application (Staging/Production).
  Builds/minifies HTML/CSS/JS, includes idle resource scheduling & pipeline disabling via EventBridge.
  NOTE: WAF for CloudFront must be created separately in us-east-1 and associated manually.

Parameters:
  GitHubOwner:
    Type: String
    Description: The owner of the source GitHub repository (e.g., 'lequockhanh19521680').
  GitHubRepo:
    Type: String
    Description: The name of the source GitHub repository (e.g., 'game-vibe-plane').
  GitHubBranch:
    Type: String
    Description: The branch to trigger the pipeline from.
    Default: main
  CodeStarConnectionArn:
    Type: String
    Description: >-
      The ARN of the AWS CodeStar connection to GitHub. Create this in the AWS Console under
      Developer Tools > CodePipeline > Settings > Connections.
  DomainName:
    Type: String
    Description: (optional) Custom domain name for the production site (e.g., 'www.my-game.com'). Leave blank if not used.
    Default: ""
  CertificateArn:
    Type: String
    Description: (optional) ARN of the ACM certificate for the custom domain in us-east-1. Required if DomainName is set.
    Default: ""

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # --- S3 Buckets ---

  StagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${StagingBucket}/*"

  ProductionBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # --- CloudFront for Production ---

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OAI for ${ProductionBucket}"

  ProductionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductionBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ProductionBucket}/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "CloudFront distribution for ${AWS::StackName}"
        DefaultRootObject: index.html
        Aliases: !If
          - HasDomain
          - - !Ref DomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - CertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ProductionBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          DefaultTTL: 86400
          MinTTL: 0
          MaxTTL: 31536000
        # === REMOVED WAF ASSOCIATION ===
        # WebACLId: !GetAtt WebACL.Arn

  # --- IAM Roles ---

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-*:*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${PipelineArtifactBucket}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt StagingBucket.Arn
                  - !Sub "${StagingBucket.Arn}/*"
                  - !GetAtt ProductionBucket.Arn
                  - !Sub "${ProductionBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: "*"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub "${PipelineArtifactBucket.Arn}/*"
                  - !GetAtt StagingBucket.Arn
                  - !Sub "${StagingBucket.Arn}/*"
                  - !GetAtt ProductionBucket.Arn
                  - !Sub "${ProductionBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt BuildProject.Arn
                  - !GetAtt InvalidateCacheProject.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CodeBuildRole.Arn

  # --- CodeBuild Projects ---

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-BuildProject"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
              commands:
                - echo "Installing minification tools..."
                - npm install -g terser csso-cli html-minifier
            build:
              commands:
                - echo "Starting build process for static files..."
                - mkdir build_output
                - echo "Copying assets..."
                - |
                  if [ -d "frontend/assets" ]; then
                    cp -r frontend/assets build_output/assets
                    echo "Assets copied."
                  else
                    echo "No assets directory found in frontend/."
                  fi
                - echo "Minifying CSS..."
                - |
                  if [ -d "frontend/css" ]; then
                    mkdir -p build_output/css
                    find frontend/css -name '*.css' -exec sh -c 'csso "$1" -o "build_output/css/$(basename "$1")"' sh {} \;
                    echo "CSS minification complete."
                  else
                    echo "No css directory found in frontend/."
                  fi
                - echo "Minifying JavaScript..."
                - |
                  if [ -d "frontend/js" ]; then
                    find frontend/js -type d -exec sh -c 'mkdir -p "build_output/$(echo "$1" | sed "s|^frontend/||")"' sh {} \;
                    find frontend/js -name '*.js' -exec sh -c 'terser "$1" -o "build_output/$(echo "$1" | sed "s|^frontend/||")" -c -m --source-map "content=inline"' sh {} \;
                    echo "Core JavaScript minification complete."
                  else
                    echo "No js directory found in frontend/."
                  fi
                - echo "Minifying gameConfig.js..."
                - |
                  if [ -f "frontend/gameConfig.js" ]; then
                    terser frontend/gameConfig.js -o build_output/gameConfig.js -c -m --source-map "content=inline"
                    echo "gameConfig.js minified."
                  else
                    echo "gameConfig.js not found in frontend/."
                  fi
                - echo "Minifying HTML..."
                - |
                  if [ -f "frontend/index.html" ]; then
                    html-minifier frontend/index.html \
                      --collapse-whitespace \
                      --remove-comments \
                      --remove-optional-tags \
                      --remove-redundant-attributes \
                      --remove-script-type-attributes \
                      --remove-tag-whitespace \
                      --use-short-doctype \
                      --minify-css true \
                      --minify-js true \
                      -o build_output/index.html
                    echo "index.html minified."
                  else
                    echo "index.html not found in frontend/. Cannot minify HTML."
                  fi
          artifacts:
            files:
              - '**/*'
            base-directory: 'build_output'

  InvalidateCacheProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-InvalidateCacheProject"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
        EnvironmentVariables:
          - Name: DISTRIBUTION_ID
            Value: !Ref CloudFrontDistribution
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Invalidating CloudFront cache..."
                - aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

  # --- CodePipeline ---

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub_Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Build_And_Optimize
          Actions:
            - Name: BuildAndMinifyStaticFiles
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
        - Name: Deploy_To_Staging
          Actions:
            - Name: DeployToS3
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                BucketName: !Ref StagingBucket
                Extract: true
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
        - Name: Manual_Approval
          Actions:
            - Name: Approve_Production_Deploy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              RunOrder: 1
        - Name: Deploy_To_Production
          Actions:
            - Name: DeployToS3
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                BucketName: !Ref ProductionBucket
                Extract: true
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
            - Name: InvalidateCloudFrontCache
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref InvalidateCacheProject
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 2

  # === START: EventBridge Schedules and Lambda for Idle Resources & Pipeline Scheduling ===

  SchedulerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaBasicExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*"
        - PolicyName: StopStartResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:DescribeInstances
                Resource: "*" # Consider restricting this
              - Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                  - rds:DescribeDBInstances
                Resource: "*" # Consider restricting this
        # === ADD POLICY FOR PIPELINE CONTROL ===
        - PolicyName: PipelineControlPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codepipeline:DisableStageTransition
                  - codepipeline:EnableStageTransition
                # Apply permission only to the pipeline created by this stack
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  StopIdleResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-StopIdleResources"
      Description: "Lambda function triggered by EventBridge to stop idle resources."
      Role: !GetAtt SchedulerLambdaRole.Arn
      Runtime: nodejs18.x
      Handler: scheduler/stopResources.handler
      Timeout: 60
      MemorySize: 128
      InlineCode: |
        console.log('Loading function');
        exports.handler = async (event, context) => {
          console.log('StopIdleResourcesFunction invoked:', JSON.stringify(event, null, 2));
          console.log('--- Placeholder: Implement logic to stop specific EC2/RDS resources ---');
          // Example (requires aws-sdk v3):
          // const { EC2Client, StopInstancesCommand } = require("@aws-sdk/client-ec2");
          // const client = new EC2Client({ region: process.env.AWS_REGION });
          // const command = new StopInstancesCommand({ InstanceIds: ['instance-id-1', 'instance-id-2'] }); // Replace with actual logic to find instances
          // await client.send(command);
          return { statusCode: 200, body: JSON.stringify('Stop resources function executed.') };
        };

  StartIdleResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-StartIdleResources"
      Description: "Lambda function triggered by EventBridge to start idle resources."
      Role: !GetAtt SchedulerLambdaRole.Arn
      Runtime: nodejs18.x
      Handler: scheduler/startResources.handler
      Timeout: 60
      MemorySize: 128
      InlineCode: |
        console.log('Loading function');
        exports.handler = async (event, context) => {
          console.log('StartIdleResourcesFunction invoked:', JSON.stringify(event, null, 2));
          console.log('--- Placeholder: Implement logic to start specific EC2/RDS resources ---');
          // Example (requires aws-sdk v3):
          // const { EC2Client, StartInstancesCommand } = require("@aws-sdk/client-ec2");
          // const client = new EC2Client({ region: process.env.AWS_REGION });
          // const command = new StartInstancesCommand({ InstanceIds: ['instance-id-1', 'instance-id-2'] }); // Replace with actual logic
          // await client.send(command);
          return { statusCode: 200, body: JSON.stringify('Start resources function executed.') };
        };

  # === ADD LAMBDA FUNCTIONS FOR PIPELINE CONTROL ===
  DisablePipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-DisablePipeline"
      Description: "Disables the Source stage transition in the CodePipeline."
      Role: !GetAtt SchedulerLambdaRole.Arn
      Runtime: nodejs18.x
      Handler: scheduler/disablePipeline.handler # Assume you create this file
      Timeout: 60
      MemorySize: 128
      # Pass Pipeline name as environment variable
      Environment:
        Variables:
          PIPELINE_NAME: !Ref Pipeline
      InlineCode: |
        const { CodePipelineClient, DisableStageTransitionCommand } = require("@aws-sdk/client-codepipeline");
        const pipelineName = process.env.PIPELINE_NAME;
        const stageName = 'Source'; // Target the first stage
        const transitionType = 'Inbound'; // Prevent stage from starting
        const reason = 'Pipeline automatically disabled during off-hours by EventBridge schedule.';

        exports.handler = async (event) => {
          console.log(`Attempting to disable transition for pipeline: ${pipelineName}, stage: ${stageName}`);
          const client = new CodePipelineClient({ region: process.env.AWS_REGION });
          const command = new DisableStageTransitionCommand({
            pipelineName: pipelineName,
            stageName: stageName,
            transitionType: transitionType,
            reason: reason,
          });

          try {
            await client.send(command);
            console.log(`Successfully disabled inbound transition for stage ${stageName} in pipeline ${pipelineName}.`);
            return { statusCode: 200, body: 'Pipeline transition disabled.' };
          } catch (error) {
            console.error(`Error disabling pipeline transition: ${error}`);
            // Don't throw error to prevent schedule retries if it fails once
            return { statusCode: 500, body: 'Error disabling pipeline transition.' };
          }
        };

  EnablePipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-EnablePipeline"
      Description: "Enables the Source stage transition in the CodePipeline."
      Role: !GetAtt SchedulerLambdaRole.Arn
      Runtime: nodejs18.x
      Handler: scheduler/enablePipeline.handler # Assume you create this file
      Timeout: 60
      MemorySize: 128
      # Pass Pipeline name as environment variable
      Environment:
        Variables:
          PIPELINE_NAME: !Ref Pipeline
      InlineCode: |
        const { CodePipelineClient, EnableStageTransitionCommand } = require("@aws-sdk/client-codepipeline");
        const pipelineName = process.env.PIPELINE_NAME;
        const stageName = 'Source'; // Target the first stage
        const transitionType = 'Inbound'; // Re-enable starting the stage

        exports.handler = async (event) => {
          console.log(`Attempting to enable transition for pipeline: ${pipelineName}, stage: ${stageName}`);
          const client = new CodePipelineClient({ region: process.env.AWS_REGION });
          const command = new EnableStageTransitionCommand({
            pipelineName: pipelineName,
            stageName: stageName,
            transitionType: transitionType,
          });

          try {
            await client.send(command);
            console.log(`Successfully enabled inbound transition for stage ${stageName} in pipeline ${pipelineName}.`);
            return { statusCode: 200, body: 'Pipeline transition enabled.' };
          } catch (error) {
            console.error(`Error enabling pipeline transition: ${error}`);
            // Don't throw error to prevent schedule retries
            return { statusCode: 500, body: 'Error enabling pipeline transition.' };
          }
        };

  StopResourcesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-StopIdleResourcesSchedule"
      Description: "Stops idle resources daily at 1 AM Vietnam time (18:00 UTC previous day)."
      ScheduleExpression: "cron(0 18 * * ? *)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: "ENABLED"
      Target:
        Arn: !GetAtt StopIdleResourcesFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeLambdaRole.Arn

  StartResourcesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-StartIdleResourcesSchedule"
      Description: "Starts idle resources daily at 8 AM Vietnam time (01:00 UTC)."
      ScheduleExpression: "cron(0 1 * * ? *)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: "ENABLED"
      Target:
        Arn: !GetAtt StartIdleResourcesFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeLambdaRole.Arn

  # === ADD SCHEDULES FOR PIPELINE CONTROL ===
  DisablePipelineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-DisablePipelineSchedule"
      Description: "Disables pipeline Source stage transition at 1 AM Vietnam time (18:00 UTC previous day)."
      ScheduleExpression: "cron(0 18 * * ? *)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: "ENABLED"
      Target:
        Arn: !GetAtt DisablePipelineFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeLambdaRole.Arn

  EnablePipelineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-EnablePipelineSchedule"
      Description: "Enables pipeline Source stage transition at 8 AM Vietnam time (01:00 UTC)."
      ScheduleExpression: "cron(0 1 * * ? *)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: "ENABLED"
      Target:
        Arn: !GetAtt EnablePipelineFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeLambdaRole.Arn

  SchedulerInvokeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "lambda:InvokeFunction"
                Resource:
                  - !GetAtt StopIdleResourcesFunction.Arn
                  - !GetAtt StartIdleResourcesFunction.Arn
                  # === ADD PERMISSION TO INVOKE NEW LAMBDAS ===
                  - !GetAtt DisablePipelineFunction.Arn
                  - !GetAtt EnablePipelineFunction.Arn

  # === END: EventBridge Schedules and Lambda ===

Outputs:
  StagingWebsiteURL:
    Description: "Clickable URL for the STAGING environment (S3 public website)"
    Value: !GetAtt StagingBucket.WebsiteURL

  ProductionURL:
    Description: "Clickable URL for the PRODUCTION environment (CloudFront)"
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${CloudFrontDistribution.DomainName}"

  PipelineConsoleUrl:
    Description: "URL to view the CodePipeline in the AWS Console"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
